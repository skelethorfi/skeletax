name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a full commit SHA (the tag it was, in the comment): a tag can be moved.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run summ-sync tests with coverage
        run: cd packages/summ-sync && npm run typecheck && npm run test:coverage
