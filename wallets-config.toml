
# Start and end date to get transactions for
# toDate is optional
fromDate = "2020-01-01"
toDate = "2024-12-31"

# How to split up the exported CSV files for each wallet
# yearly  - one file per year
# monthly - one file per month
# none    - single file
frequency = "yearly"

# Optional: the time zone whose calendar days make up the periods, so that a
# year's files hold the rows your tax software counts in that year. Default: UTC
# timezone = "Europe/London"

# Optional: protocols to export, queried for every wallet. Default: ["thorchain"]
# Add "maya" to include swaps and liquidity on Maya Protocol (see docs/specs/maya.md)
# protocols = ["thorchain", "maya"]

# Optional: name secured and trade assets with a prefix instead of the L1 asset's name
# (see docs/specs/assets.md). Default: false for both, e.g. secured ETH-USDC exports as USDC
# [assets]
# prefixSecuredAssets = true   # ThorSecured.ETH.USDC
# prefixTradeAssets = true     # ThorTrade.BTC.BTC

# Optional: path to output/ directory
# outputPath = "/some/path/output"

# Optional: path to the store of downloaded data (default: store/ next to this config).
# Several configs (e.g. one per tax year) can share one store.
# storePath = "/some/path/store"

# Optional: days after its date that a THORNode or Cosmos tx still pending counts as stuck (default: 30).
# A run stops fetching a stuck tx again; --refetch-all still does.
# pendingStuckDays = 30

# Optional: days after its date that an action still pending may yet finalise (default: 3). The run summary
# lists every action that is not final as recent (younger than this), waiting, or stuck.
# pendingGraceDays = 3

# Only if a wallet took part in Maya's 2023 liquidity auction (the run stops and asks when it finds one):
# "income"  - what the auction supplied (the CACAO side) is income when it ended, then added to the pool
# "deposit" - the position's cost is the RUNE you deposited; any gain shows when you withdraw
# mayaLiquidityAuction = "income"

# Optional: senders whose transfers to your wallets are income, e.g. a project's reward distribution wallet.
# Every other transfer you receive is a plain receive. Unset: MAYA from the known Maya distribution wallets is
# income (docs/specs/sends.md). Setting it replaces those; incomeFrom = [] makes every transfer a receive.
# incomeFrom = ["maya1...", "thor1..."]

# Optional: which rows carry a USD reference price, which Summ uses instead of its own market price (docs/specs/prices.md).
# "swaps" - as before: swaps (Midgard's price of each side), bRUNE sells and TCY distributions (default)
# "all"   - also every other row whose asset Midgard prices, and LP and savers position tokens (the value of what
#           went in or came out); fetches the prices it needs
# referencePrices = "swaps"

# List of wallets
# add a new [[wallets]] entry for each wallet
# add each wallet that was used in swaps/LP/etc
# remove/replace the sample wallets below

# Wallet 1
[[wallets]]

# 'name' is a descriptive name for the wallet which will be added to the CSV filename
name = "Sample"

# wallet address
address = "thor1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 'blockchain' is only used in the CSV filename.
# Only THORChain wallets need to be imported into Crypto Tax Calculator.
# Other blockchain wallet CSV files can be used for reference when categorising transactions in CTC.
blockchain = "THOR"

# Wallet 2 (remove if not required)
[[wallets]]
name = "Sample"
address = "0x0000000000000000000000000000000000000000"
blockchain = "ETH"

# Wallet 3 (remove if not required)
[[wallets]]
name = "Sample"
address = "bc1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
blockchain = "BTC"
